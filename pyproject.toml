[project]
name = "linkbert-seo"
version = "0.1.0"
description = "Internal link suggestions powered by dejanseo/LinkBERT"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "transformers",
  "sentence-transformers",
  "beautifulsoup4",
  "lxml",
  "requests",
  "numpy",
]

[project.scripts]
linkbert = "lb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lb"]
